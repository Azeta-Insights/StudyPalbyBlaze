<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Flame Outer Gradient -->
    <linearGradient id="blazeOuterGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FFA270" />
      <stop offset="45%" stopColor="#FF6321" />
      <stop offset="100%" stopColor="#D84315" />
    </linearGradient>

    <!-- Flame Inner Core Gradient -->
    <linearGradient id="blazeInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FFFDE7" />
      <stop offset="40%" stopColor="#FFE082" />
      <stop offset="100%" stopColor="#FFA000" />
    </linearGradient>

    <!-- Mortarboard Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow for Tab Contrast -->
  <circle cx="50" cy="54" r="42" fill="#FF6321" opacity="0.18" />

  <!-- Outer Flame Body -->
  <path
    d="M 50 14
       C 68 36, 84 52, 84 68
       C 84 84, 68 88, 50 88
       C 32 88, 16 84, 16 68
       C 16 52, 32 36, 50 14 Z"
    fill="url(#blazeOuterGrad)"
  />

  <!-- Inner Warm Core -->
  <path
    d="M 50 40
       C 62 56, 70 68, 70 78
       C 70 88, 60 90, 50 90
       C 40 90, 30 88, 30 78
       C 30 68, 38 56, 50 40 Z"
    fill="url(#blazeInnerGrad)"
    opacity="0.95"
  />

  <!-- Scholastic Mortarboard Graduation Cap -->
  <!-- Skullcap Base -->
  <path
    d="M 36 22 L 36 29 C 36 33, 64 33, 64 29 L 64 22 Z"
    fill="url(#capGrad)"
  />
  <!-- Cap Diamond Top -->
  <polygon
    points="50,11 76,20 50,29 24,20"
    fill="#0F172A"
    stroke="#334155"
    strokeWidth="1.2"
  />
  <!-- Golden Center Button -->
  <circle cx="50" cy="20" r="2.8" fill="#F59E0B" />
  <!-- Golden Tassel Cord -->
  <path
    d="M 50 20 Q 64 22, 70 32"
    stroke="#F59E0B"
    strokeWidth="2.2"
    fill="none"
    strokeLinecap="round"
  />
  <!-- Golden Tassel End Knot -->
  <circle cx="70" cy="32" r="3.2" fill="#F59E0B" />

  <!-- Rosy Cheeks -->
  <circle cx="33" cy="68" r="4.5" fill="#F43F5E" opacity="0.4" />
  <circle cx="67" cy="68" r="4.5" fill="#F43F5E" opacity="0.4" />

  <!-- Shiny Cartoon Eyes -->
  <!-- Left Eye -->
  <circle cx="39" cy="61" r="4" fill="#0F172A" />
  <circle cx="40.5" cy="59.5" r="1.6" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="61" cy="61" r="4" fill="#0F172A" />
  <circle cx="62.5" cy="59.5" r="1.6" fill="#FFFFFF" />

  <!-- Cheerful Smile -->
  <path
    d="M 42 71 Q 50 81, 58 71"
    stroke="#0F172A"
    strokeWidth="2.8"
    strokeLinecap="round"
    fill="none"
  />
</svg>
